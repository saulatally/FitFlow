<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>FitFlow</h1>

<div id="controls">
    <label>Secondi di lavoro:
        <input type="number" id="workInput" value="40">
    </label>

    <label>Secondi di pausa:
        <input type="number" id="restInput" value="10">
    </label>

    <button id="startBtn">Avvia</button>
</div>

<!-- Mini preview -->
<div id="videoGallery"></div>

<!-- Video grande -->
<video id="exerciseVideo" autoplay muted loop playsinline></video>

<!-- Timer circolare -->
<div id="circleContainer">
    <svg id="progressRing" width="200" height="200">
        <circle id="ringBg" cx="100" cy="100" r="90"></circle>
        <circle id="ring" cx="100" cy="100" r="90"></circle>
    </svg>
    <div id="countdownText">0</div>
</div>

<!-- Routine selector -->
<div id="routineSelector">
    <button onclick="startRoutine(1)">Routine 1 — Libera</button>
    <button onclick="startRoutine(2)">Routine 2 — Tutti gli esercizi</button>
    <button onclick="startRoutine(3)">Routine 3 — Ogni esercizio 3 volte</button>
</div>

<script src="app.js"></script>
</body>
</html>
