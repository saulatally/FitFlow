<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allenamento</title>
<link rel="manifest" href="manifest.json">
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    margin-bottom: 10px;
}

/* MINI VIDEO */
#videoGallery {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
}

.thumb {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid #ccc;
}

.thumb.selected {
    border-color: #0078ff;
}

/* VIDEO GRANDE */
#exerciseVideo {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 20px;
}

/* TIMER CIRCOLARE */
#timerCircle {
    width: 260px;
    height: 260px;
    margin: 0 auto;
    position: relative;
}

svg {
    transform: rotate(-90deg);
}

#timerText {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
}

#phaseText {
    margin-top: 20px;
    font-size: 24px;
}

#roundText {
    font-size: 20px;
    color: #555;
}

/* BOTTONI */
.btn {
    font-size: 20px;
    padding: 12px 22px;
    border-radius: 12px;
    border: none;
    margin: 6px;
    color: white;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.15s;
}

.btn:hover {
    transform: scale(1.07);
}

.start { background: #28a745; }
.pause { background: #ffc107; color: black; }
.reset { background: #dc3545; }
.routine { background: #0078ff; }

/* MUSICA */
#musicPlayer {
    display: none;
}
</style>
</head>
<body>

<h1>Allenamento</h1>

<!-- MINI VIDEO -->
<div id="videoGallery">
    <video class="thumb" src="Es1.mp4" muted onclick="toggleVideo('Es1.mp4', this)"></video>
    <video class="thumb" src="Es2.mp4" muted onclick="toggleVideo('Es2.mp4', this)"></video>
    <video class="thumb" src="Es3.mp4" muted onclick="toggleVideo('Es3.mp4', this)"></video>
    <video class="thumb" src="Es4.mp4" muted onclick="toggleVideo('Es4.mp4', this)"></video>
    <video class="thumb" src="Es5.mp4" muted onclick="toggleVideo('Es5.mp4', this)"></video>
    <video class="thumb" src="Es6.mp4" muted onclick="toggleVideo('Es6.mp4', this)"></video>
    <video class="thumb" src="Es7.mp4" muted onclick="toggleVideo('Es7.mp4', this)"></video>
    <video class="thumb" src="Es8.mp4" muted onclick="toggleVideo('Es8.mp4', this)"></video>
    <video class="thumb" src="Es9.mp4" muted onclick="toggleVideo('Es9.mp4', this)"></video>
    <video class="thumb" src="Es10.mp4" muted onclick="toggleVideo('Es10.mp4', this)"></video>
</div>

<!-- VIDEO GRANDE -->
<video id="exerciseVideo" autoplay muted playsinline loop></video>

<!-- MUSICA -->
<audio id="musicPlayer" src="musica.mp3"></audio>

<!-- TIMER -->
<div id="timerCircle">
    <svg width="260" height="260">
        <circle cx="130" cy="130" r="120" stroke="#ddd" stroke-width="20" fill="none"/>
        <circle id="progressRing" cx="130" cy="130" r="120"
                stroke="#4CAF50" stroke-width="20" fill="none"
                stroke-linecap="round"
                stroke-dasharray="754"
                stroke-dashoffset="754"/>
    </svg>

    <div id="timerText">00:00</div>
</div>

<div id="phaseText">Fase</div>
<div id="roundText">Round</div>

<!-- BOTTONI -->
<div style="margin-top:15px;">
    <button class="btn start" onclick="resumeTimer()">▶ Avvia</button>
    <button class="btn pause" onclick="pauseTimer()">❚❚ Pausa</button>
    <button class="btn reset" onclick="resetTimer()">⟳ Reset</button>
</div>

<div style="margin-top:15px;">
    <button class="btn routine" onclick="startFreeRoutine()">Routine libera</button>
    <button class="btn routine" onclick="startAllRoutine()">Tutti gli esercizi (1×40s)</button>
    <button class="btn routine" onclick="startSequentialRoutine()">Ogni esercizio 3×40s</button>
</div>

<div style="margin-top:15px;">
    <button class="btn start" onclick="toggleMusic()">🎵 Musica</button>
</div>

<script src="app.js"></script>
</body>
</html>
